# Periphery — https://github.com/peripheryapp/periphery
#
# Discovery: Periphery loads `.periphery.yml` from the current working directory only.
# From a package subfolder, pass an explicit config path, for example:
#   periphery scan --config ../../.periphery.yml --targets Feature_Calendar
#
# For the Xcode app (requires scheme + project), from repo root:
#   periphery scan --project InvoicingApplication.xcodeproj --schemes InvoicingApplication
# (Periphery 3.x: use --schemes / --exclude-targets — there is no --targets flag.)
#
# If `build-for-testing` fails (e.g. SDKROOT pin, broken test target), build app + reuse index store:
#   DERIVED="$PWD/build_cache_periphery"
#   xcodebuild -project InvoicingApplication.xcodeproj -scheme InvoicingApplication -configuration Debug \
#     -destination 'platform=macOS' -derivedDataPath "$DERIVED" -sdk macosx26.5 \
#     CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=YES INDEX_ENABLE_DATA_STORE=YES build
#   periphery scan --project InvoicingApplication.xcodeproj --schemes InvoicingApplication \
#     --skip-build --skip-schemes-validation --index-store-path "$DERIVED/Index.noindex/DataStore"

# SPM feature modules / Core / Data expose public entry points consumed only by the app target.
# Turning this off surfaces many false positives; if you need stricter CI, try `retain_public: false`
# on a branch and add explicit `retain:` rules or `// periphery:ignore` for genuine exceptions.
retain_public: true

# SwiftUI: #Preview / PreviewProvider are not referenced like normal code paths.
retain_swift_ui_previews: true

# Observable view models, two-way bindings, and delegate storage often assign without a static “read” edge.
retain_assign_only_properties: true

# Protocol requirements satisfied in conforming types; parameters can look unused in individual witnesses.
retain_unused_protocol_func_params: true

# DTOs, export models, and CodingKeys-backed types — properties may only be touched by synthesis or encoders.
retain_codable_properties: true
retain_encodable_properties: true

# macOS: NSObject subclasses, selectors, and explicit @objc/@objcMembers surface keep symbols alive at runtime.
retain_objc_accessible: true
retain_objc_annotated: true

# Hide sandbox / placeholder sources from the unused-code report (they are not production feature surfaces).
report_exclude:
  - "**/ActivityPlaceholderView.swift"
  - "**/InspectorPlaceholderView.swift"

# Defaults already include .build and SPM checkouts; add local noise that should not affect reachability.
index_exclude:
  - "**/.build/**"
  - "**/build_cache_periphery/**"

# Further escape hatches (not configured here — use when a symbol is genuinely used but invisible to the indexer):
# - Declaration: // periphery:ignore (line above the symbol; add optional trailing explanation)
# - Whole file: // periphery:ignore:all (must be first in file, before imports)
# - Parameters: // periphery:ignore:parameters paramA,paramB
# - Baseline: periphery scan --write-baseline periphery_baseline.json then --baseline periphery_baseline.json
